name: Verifica Documenti e Struttura

on:
  push:
    paths:
      - 'Candidatura/**'
      - 'RTB/**'
      - 'PB/**'
      - 'Diapositive/**'
      - '.github/template/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Candidatura/**'
      - 'RTB/**'
      - 'PB/**'
      - 'Diapositive/**'
      - '.github/template/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: "check-docs-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check-documents:
    name: Verifica Naming e Compilazione Typst
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa PlantUML e Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml graphviz

      - name: Verifica automatica PlantUML e genera gli SVG
        shell: bash
        run: |
          set -e
          dir="RTB/Analisi_dei_Requisiti/Casi_Uso"
          mkdir -p "$dir"
          printf '@startuml\nAlice -> Bob: prova CI\n@enduml\n' > "$dir/__ci_test__.puml"
          python .github/scripts/generate_plantuml.py
          test -s "$dir/out/__ci_test__.svg"
          rm "$dir/__ci_test__.puml" "$dir/out/__ci_test__.svg"

      - name: Esegui controllo struttura e compilazione documenti
        run: |
          python .github/scripts/validate_structure.py --root-dir .
