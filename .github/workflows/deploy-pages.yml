name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Compilazione e Assemblaggio Sito
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pymupdf

      - name: Compilazione Typst e Assemblaggio Sito
        run: |
          mkdir -p _site/Candidatura/Verbali/Interni
          mkdir -p _site/Candidatura/Verbali/Esterni
          mkdir -p _site/Diapositive

          # Compila Documenti Principali di Candidatura (se presenti)
          if [ -f "Candidatura/Valutazione_dei_Capitolati.typ" ]; then
            echo "Compilazione Valutazione dei Capitolati..."
            typst compile --root . Candidatura/Valutazione_dei_Capitolati.typ _site/Candidatura/Valutazione_dei_Capitolati.pdf
          fi
          if [ -f "Candidatura/Dichiarazione_degli_Impegni.typ" ]; then
            echo "Compilazione Dichiarazione degli Impegni..."
            typst compile --root . Candidatura/Dichiarazione_degli_Impegni.typ _site/Candidatura/Dichiarazione_degli_Impegni.pdf
          fi
          # Compila Lettera di Presentazione
          lettera=$(find Candidatura -maxdepth 1 -name "*_Lettera_di_Presentazione.typ" 2>/dev/null | head -n 1)
          if [ -n "$lettera" ] && [ -f "$lettera" ]; then
            base=$(basename "$lettera" .typ)
            echo "Compilazione Lettera di Presentazione ($base)..."
            typst compile --root . "$lettera" "_site/Candidatura/${base}.pdf"
          fi

          # Compila Verbali Interni Candidatura
          if [ -d "Candidatura/Verbali/Interni" ]; then
            for f in Candidatura/Verbali/Interni/*.typ; do
              if [ -f "$f" ]; then
                base=$(basename "$f" .typ)
                echo "Compilazione verbale $base..."
                typst compile --root . "$f" "_site/Candidatura/Verbali/Interni/${base}.pdf"
              fi
            done
          fi

          # Compila Verbali Esterni Candidatura (se presenti)
          if [ -d "Candidatura/Verbali/Esterni" ]; then
            for f in Candidatura/Verbali/Esterni/*.typ; do
              if [ -f "$f" ]; then
                base=$(basename "$f" .typ)
                echo "Compilazione verbale esterno $base..."
                typst compile --root . "$f" "_site/Candidatura/Verbali/Esterni/${base}.pdf"
              fi
            done
          fi

          # Copia Verbali Esterni firmati esistenti (.pdf)
          if [ -d "Candidatura/Verbali/Esterni" ]; then
            cp -v Candidatura/Verbali/Esterni/*.pdf _site/Candidatura/Verbali/Esterni/ 2>/dev/null || true
          fi

          # Copia Diapositive / Diari di bordo (.pdf)
          if [ -d "Diapositive" ]; then
            cp -v Diapositive/*.pdf _site/Diapositive/ 2>/dev/null || true
          fi

          # Copia sorgenti sito web statico (.github/site) nella radice di _site
          cp -r .github/site/* _site/

          # Generazione dinamica: estrazione versioni, anteprime e compilazione card LIFO
          python .github/scripts/generate_site.py --site-dir _site --root-dir .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Pubblicazione su GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
