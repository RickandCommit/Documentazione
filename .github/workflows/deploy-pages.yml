name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Compilazione e Assemblaggio Sito
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pymupdf

      - name: Compilazione Typst e Assemblaggio Sito
        run: |
          # Supporto dinamico a tutte le fasi: Candidatura, RTB, PB
          for phase in Candidatura RTB PB; do
            if [ -d "$phase" ]; then
              mkdir -p "_site/$phase/Verbali/Interni"
              mkdir -p "_site/$phase/Verbali/Esterni"

              # 1. Compila Documenti Principali di baseline (*.typ nella root della fase)
              for f in "$phase"/*.typ; do
                if [ -f "$f" ]; then
                  base=$(basename "$f" .typ)
                  echo "Compilazione documento $base ($phase)..."
                  typst compile --root . "$f" "_site/$phase/${base}.pdf"
                fi
              done

              # 2. Compila Verbali Interni
              if [ -d "$phase/Verbali/Interni" ]; then
                for f in "$phase/Verbali/Interni"/*.typ; do
                  if [ -f "$f" ]; then
                    base=$(basename "$f" .typ)
                    echo "Compilazione verbale interno $base ($phase)..."
                    typst compile --root . "$f" "_site/$phase/Verbali/Interni/${base}.pdf"
                  fi
                done
              fi

              # 3. Compila Verbali Esterni (se sorgenti .typ)
              if [ -d "$phase/Verbali/Esterni" ]; then
                for f in "$phase/Verbali/Esterni"/*.typ; do
                  if [ -f "$f" ]; then
                    base=$(basename "$f" .typ)
                    echo "Compilazione verbale esterno $base ($phase)..."
                    typst compile --root . "$f" "_site/$phase/Verbali/Esterni/${base}.pdf"
                  fi
                done
              fi

              # 4. Copia Verbali Esterni firmati esistenti (.pdf)
              if [ -d "$phase/Verbali/Esterni" ]; then
                cp -v "$phase/Verbali/Esterni"/*.pdf "_site/$phase/Verbali/Esterni/" 2>/dev/null || true
              fi
            fi
          done

          # Copia Diapositive / Diari di bordo (.pdf)
          mkdir -p _site/Diapositive
          if [ -d "Diapositive" ]; then
            cp -v Diapositive/*.pdf _site/Diapositive/ 2>/dev/null || true
          fi

          # Copia sorgenti sito web statico (.github/site) nella radice di _site
          cp -r .github/site/* _site/

          # Generazione dinamica: estrazione versioni, anteprime e compilazione card LIFO
          python .github/scripts/generate_site.py --site-dir _site --root-dir .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Pubblicazione su GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
