A:
  "Abilità (Skill)": "Modulo o sequenza di istruzioni logiche ed operative che consente al Concierge di eseguire un'attività specifica. Si distinguono in abilità informative (consultazione di dati o documenti) e abilità operative (modifica o invio di richieste)."
  "Action (GitHub Actions)": "Piattaforma di integrazione e distribuzione continua (CI/CD) integrata in GitHub che consente di automatizzare flussi di lavoro quali compilazione, esecuzione dei test e validazione dei documenti tramite script personalizzati."
  "Allucinazione (Hallucination)": "Fenomeno tipico dei modelli linguistici (LLM) consistente nella generazione di risposte formalmente coerenti e convincenti, ma prive di fondamento reale o non supportate dalle fonti documentali fornite."
  "Amministratore (Ruolo di Progetto)": "Membro del team incaricato di presidiare l'infrastruttura del repository, governare gli strumenti di supporto e configurazione, verificare il rispetto del Way of Working e gestire l'automazione dei processi di rilascio."
  "Amministrazione (Profilo Utente / HR)": "Profilo applicativo abilitato all'accesso al backoffice aziendale con privilegi di configurazione, caricamento, aggiornamento o ritiro delle fonti documentali e supervisione delle richieste."
  "Analisi dei Requisiti (AdR)": "Documento formale esterno redatto dal gruppo fornitore che raccoglie, struttura e formalizza i requisiti del sistema (funzionali, qualitativi, di vincolo) associandoli ai relativi Casi d'Uso (Use Cases)."
  "Analista (Ruolo di Progetto)": "Membro del team incaricato di esplorare il dominio applicativo, dialogare con il proponente, individuare i bisogni degli stakeholder e formalizzarli sotto forma di requisiti e scenari d'uso."
  "API (Application Programming Interface)": "Insieme di definizioni e protocolli mediante i quali un'applicazione o servizio comunica ed espone le proprie funzionalità ad altri software."
  "Approvazione": "Atto formale con cui il Responsabile di progetto (per la documentazione interna) o il committente/proponente (per i deliverable) valida e congela una specifica versione di un artefatto."
  "Architettura Software": "Struttura organizzativa complessiva del sistema informatico, definita in termini di componenti logici, interfacce, relazioni reciproche e pattern architetturali adottati."
  "Astensione": "Comportamento proattivo e vincolante del Concierge che, a fronte di una domanda per la quale le fonti informative autorizzate risultano assenti, insufficienti o in contrasto insanabile, dichiara esplicitamente l'impossibilità di rispondere evitando congetture o allucinazioni."
  "Attore": "Entità esterna al sistema (umana o software) che interagisce con esso per perseguire uno scopo (attore primario) o per offrire servizi di supporto (attore secondario)."
  "Autenticazione": "Procedimento informatico atto a verificare con certezza l'identità dichiarata da un utente (es. dipendente o amministratore) che accede al sistema."
  "Autorizzazione": "Insieme di regole e controlli applicativi che determinano le risorse, le fonti e le azioni a cui un utente autenticato ha diritto di accedere in base al suo profilo e alla sua appartenenza aziendale."
  "AWS (Amazon Web Services)": "Piattaforma di servizi cloud computing citata nei documenti di riferimento di capitolato come esempio architetturale per la gestione di Knowledge Bases e funzionalità di Tool Use."
B:
  "Backend": "Insieme delle componenti logiche e architetturali del sistema che operano lato server, deputate all'elaborazione dei dati, all'orchestrazione dei modelli AI, alla persistenza e alla comunicazione con servizi esterni."
  "Backlog": "Elenco ordinato e prioritizzato delle attività, dei requisiti e dei compiti di sviluppo da realizzare all'interno del progetto didattico."
  "Backoffice": "Interfaccia gestionale riservata all'amministrazione aziendale per il governo delle fonti documentali (caricamento, organizzazione, ritiro) e la consultazione degli esiti e delle configurazioni dell'assistente."
  "Baseline": "Punto di riferimento formale e concordato nello sviluppo del progetto (es. RTB, PB), sottoposto a verifica e approvazione, che definisce uno stato stabile del software e dei documenti dal quale proseguire."
  "Best Practice": "Metodologia, convenzione o procedura operativa collaudata che si è dimostrata la più efficace ed efficiente per garantire un elevato standard qualitativo."
  "Branch": "Linea indipendente di sviluppo all'interno di un repository Git, utilizzata per isolare le modifiche relative a un compito prima di fonderle nel ramo principale."
  "BRD (Business Requirements Document)": "Documento di specifica fornito dall'azienda proponente (Eggon) contenente i requisiti di business, gli obiettivi strategici, il perimetro e i criteri di accettazione del progetto."
  "Bucket": "Contenitore logico configurabile all'interno del backoffice in cui vengono raggruppate fonti documentali e basi di conoscenza, caratterizzato da nome, descrizione, finalità e profilazione dei destinatari autorizzati."
  "Bug": "Anomalia, difetto o malfunzionamento nel codice software o nella documentazione che causa comportamenti imprevisti o difformi dalle specifiche attese."
C:
  "CA (Customer Acceptance)": "Terza e facoltativa revisione di avanzamento del corso di Ingegneria del Software, consistente nel collaudo formale del prodotto finale alla presenza del committente e del proponente."
  "Candidatura": "Fase iniziale del percorso accademico in cui ciascun gruppo fornitore valuta i capitolati d'appalto disponibili e sottopone al committente la propria dichiarazione di preferenza e di impegno."
  "Capitolato": "Documento contrattuale preliminare redatto da un'azienda proponente che illustra il problema da risolvere, il contesto di riferimento, i requisiti di massima e le tecnologie coinvolte. Per RickandCommit il capitolato è il C2."
  "Caso d'Uso (Use Case - UC)": "Descrizione strutturata di uno scenario operativo in cui uno o più attori interagiscono con il sistema per raggiungere un obiettivo di valore misurabile."
  "Chatbot": "Componente dell'interfaccia utente (PWA) attraverso cui il dipendente interagisce in linguaggio naturale con il Concierge."
  "Chunking": "Tecnica di segmentazione di un testo o documento in porzioni discrete (chunk) semanticamente coerenti, propedeutica alla vettorizzazione e all'archiviazione in un database vettoriale."
  "CI/CD (Continuous Integration / Continuous Delivery)": "Insieme di pratiche operative mirate all'automazione continua delle fasi di integrazione, test e distribuzione del software e della documentazione."
  "Citazione (delle fonti)": "Indicazione esplicita e verificabile dei riferimenti documentali (manuale, regolamento aziendale, paragrafo) da cui il Concierge ha estratto le evidenze utilizzate per formulare la risposta."
  "Committente": "Figura accademica che valuta e approva formalmente il lavoro svolto dal team fornitore; nel corso è rappresentata dal Prof. Tullio Vardanega congiuntamente al Prof. Riccardo Cardin."
  "Concierge": "Assistente conversazionale intelligente introdotto all'interno dell'applicazione NEXUM con lo scopo di facilitare l'accesso alle informazioni aziendali, guidare l'utilizzo del software e permettere l'inoltro di richieste operative."
  "Conferma Esplicita": "Passaggio obbligatorio e non aggirabile del dialogo in cui il Concierge mostra all'utente un riepilogo puntuale dei dati raccolti per una richiesta e ne richiede la convalida prima dell'invio effettivo ai servizi di backend."
  "Conoscenza Aziendale": "Patrimonio informativo costituito da policy interne, regolamenti e procedure aziendali caricate e manutenute dall'amministrazione tramite il backoffice."
  "Conoscenza di Prodotto": "Insieme delle istruzioni, guide utente e manuali operativi specifici della piattaforma NEXUM forniti da Eggon, distinti dai regolamenti aziendali interni."
  "Consulente del Lavoro": "Figura professionale o studio incaricato della gestione payroll, adempimenti normativi e gestione del personale per conto delle organizzazioni clienti della piattaforma NEXUM."
  "Contratto di Integrazione": "Specificazione tecnica formale (endpoint, payload JSON, codici di stato) concordata con il proponente Eggon per disciplinare l'interazione tra il Concierge e i servizi NEXUM (o i loro simulatori)."
  "Criteri di Accettazione": "Insieme di condizioni e prove oggettive definite dal proponente nel capitolato che il prodotto (MVP) deve superare per essere considerato conforme e accettato."
D:
  "Dashboard (Cruscotto)": "Pannello informativo grafico o sintetico utilizzato per monitorare lo stato di salute del progetto, l'avanzamento dei compiti e i valori delle metriche di qualità."
  "Deliverable": "Qualsiasi artefatto, documento, libreria o eseguibile software rilasciato in via ufficiale e tracciabile a supporto di una revisione di progresso."
  "Diario di Bordo": "Relazione periodica (settimanale o bisettimanale) esposta dal Responsabile di progetto durante le lezioni, finalizzata a rendicontare il lavoro svolto, le attività pianificate, le ore impiegate e le criticità riscontrate."
  "Dipendente (Personale)": "Utente finale autenticato che interagisce con il Concierge per ottenere chiarimenti sulle regole aziendali, consultare la propria situazione o registrare ferie e permessi."
  "Distillazione": "Processo di elaborazione e sintesi di informazioni non strutturate estratte dalle fonti primarie per produrre unità di conoscenza strutturate, preservandone vincoli e significato."
E:
  "Eggon (Eggon S.r.l.)": "Software house italiana con sede a Padova, proponente del capitolato d'appalto"
  "C2 \"NEXUM": "Concierge per il dipendente\"."
  "Embedding": "Mappatura matematica di parole, frasi o paragrafi in vettori numerici a molte dimensioni, tale che la vicinanza geometrica rappresenti l'affinità semantica."
  "End-to-End (E2E)": "Modalità di esecuzione o test che attraversa l'intero flusso architetturale del sistema, dall'interfaccia utente iniziale fino alla persistenza e risposta dei servizi di backend."
F:
  "Ferie": "Periodo di riposo retribuito spettante al lavoratore dipendente. Costituisce uno dei due ambiti operativi primari previsti dal perimetro dell'MVP del capitolato."
  "Ferie Fruite": "Quantità di giorni o ore di ferie già effettivamente godute dal lavoratore in un periodo specificato, distinta dalle richieste solo approvate o in attesa."
  "Fornitore": "Il gruppo studentesco (RickandCommit) firmatario della dichiarazione di impegni e incaricato della progettazione e sviluppo della soluzione software."
  "Frontend": "Parte dell'applicazione visibile e direttamente manipolabile dall'utente, sviluppata con tecnologie web e integrata all'interno della PWA di NEXUM."
G:
  "Gate": "Componente architetturale che funge da interfaccia di disaccoppiamento tra il motore del Concierge e i servizi applicativi esterni (ricerca documentale, lettura dati personali, inoltro richieste)."
  "Git": "Sistema distribuito di controllo versione open source utilizzato per tracciare la cronologia dei file sorgente e della documentazione."
  "GitHub": "Piattaforma web di hosting per progetti software basata sul sistema Git, dotata di strumenti per revisione codice, tracciamento issue e integrazione continua."
  "Grafo di Conoscenza (Knowledge Graph)": "Rappresentazione a grafo delle informazioni in cui i nodi identificano entità o concetti e gli archi rappresentano le relazioni semantiche formali tra essi."
H:
  "HR (Human Resources)": "Divisione aziendale deputata all'amministrazione, organizzazione e gestione dei dipendenti e delle loro istanze (ferie, permessi, presenze)."
I:
  "Incremento": "Aggiunta progressiva di funzionalità software o sezioni documentali verificate, conforme ai principi dello sviluppo agile."
  "Issue": "Unità atomica di lavoro tracciata su piattaforma di gestione (GitHub Projects) avente una descrizione, un assegnatario, uno stato e una stima temporale."
J: {}
K:
  "Knowledge Base (KB)": "Archivio organizzato e strutturato della conoscenza aziendale e di prodotto, arricchito di metadati, relazioni e indici per la ricerca e il recupero."
L:
  "Large Language Model (LLM)": "Rete neurale avanzata addestrata su ingenti volumi di testo, in grado di comprendere, analizzare e generare testo in linguaggio naturale interpretando il contesto dell'utente."
  "Lettera di Presentazione": "Documento formale di accompagnamento inviato dal Responsabile di progetto al committente per candidare formalmente il gruppo a una revisione di avanzamento."
M:
  "Manuale Utente": "Documento di prodotto destinato agli utenti finali per illustrare in modo chiaro e guidato le funzionalità del sistema, le schermate e le modalità operative."
  "Metrica di Qualità": "Misura quantitativa e oggettiva del grado in cui un processo o un prodotto software soddisfa un requisito o uno standard di qualità prestabilito."
  "Milestone": "Traguardo temporale o evento significativo nel calendario di progetto che segna la conclusione di una fase o il raggiungimento di un obiettivo chiave."
  "Minimum Viable Product (MVP)": "Versione minima ma completa e funzionante del software, provvista del set"
  "essenziale di capacità concordate (per C2": "gestione ferie e permessi), idonea alla validazione sul campo e all'accettazione finale."
  "Mock (Simulatore)": "Componente software che emula fedelmente le interfacce, le risposte e il contratto di un servizio reale (es. backend NEXUM) a scopi di test o sviluppo."
N:
  "NEXUM": "Piattaforma digitale proprietaria di Eggon focalizzata sui processi di comunicazione interna e sulle relazioni tra aziende, dipendenti e professionisti paghe."
  "Norme di Progetto (NdP)": "Documento interno vincolante che definisce e codifica il Way of Working del gruppo fornitore, normando processi, strumenti, convenzioni e cicli di vita."
O:
  "OCR (Optical Character Recognition)": "Tecnologia per il riconoscimento ottico e la digitalizzazione del testo presente all'interno di immagini o documenti PDF scansionati."
  "Onboarding": "Processo di accoglienza, orientamento e formazione di una nuova persona all'atto del suo inserimento in organico aziendale (area evolutiva del capitolato C2)."
  "Ordine del Giorno (OdG)": "Elenco prefissato degli argomenti da trattare e discutere durante una riunione interna o esterna."
P:
  "PB (Product Baseline)": "Seconda revisione di avanzamento del corso di Ingegneria del Software, incentrata sulla valutazione della maturità dell'architettura software, dell'avanzamento della codifica e sulla presentazione della Specifica Tecnica."
  "Permessi (ROL)": "Quote orarie di assenza retribuita dal lavoro accordate per necessità personali o riduzione d'orario, gestite nel capitolato parallelamente alle ferie."
  "Personale": "Insieme dei lavoratori dipendenti delle aziende clienti abilitati all'uso della PWA e del Concierge."
  "Piano di Progetto (PdP)": "Documento formale che descrive la pianificazione temporale, la ripartizione dei ruoli, il preventivo dei costi, l'analisi dei rischi e il consuntivo economico."
  "Piano di Qualifica (PdQ)": "Documento formale che definisce la strategia di verifica e validazione, gli obiettivi di qualità di processo e prodotto e le relative metriche."
  "Plugin": "Componente modulare e integrabile che espone specifici strumenti, connettori o collegamenti a servizi applicativi terzi."
  "PoC (Proof of Concept)": "Prototipo software esplorativo sviluppato per la revisione RTB per dimostrare la fattibilità tecnologica dell'integrazione tra le componenti scelte."
  "Progettista (Ruolo di Progetto)": "Membro del team incaricato di definire l'architettura logica, la decomposizione in moduli e i pattern di progettazione della soluzione software."
  "Programmatore (Ruolo di Progetto)": "Membro del team incaricato della scrittura del codice sorgente e dei relativi test di unità e integrazione, in conformità alle specifiche di progetto."
  "Prompt": "Istruzione, contesto o richiesta testuale fornita in input a un modello LLM per pilotarne l'interpretazione o la generazione della risposta."
  "Prompt Engineering": "Disciplina incentrata sulla strutturazione sistematica ed euristica dei prompt per ottimizzare l'accuratezza e l'affidabilità delle risposte fornite dagli LLM."
  "Proponente": "Soggetto aziendale esterno (Eggon S.r.l., rappresentata da Gianpaolo Ferrarin) che commissiona il capitolato e ne valida il perimetro e i risultati."
  "Pull Request (PR)": "Richiesta formale di incorporare un ramo di sviluppo secondario (branch) nel ramo principale, corredata di procedura di ispezione e revisione tra pari."
  "PWA (Progressive Web App)": "Applicazione web realizzata con tecnologie aperte (HTML, CSS, JS) fruibile da browser ma installabile ed eseguibile come un'applicazione nativa sui terminali."
Q:
  "Qualità di Processo": "Grado di efficacia, rigore metodologico, tracciabilità ed efficienza con cui vengono eseguite le attività di progetto durante l'intero ciclo di vita."
  "Qualità di Prodotto": "Livello di conformità del software e della documentazione rispetto ai requisiti funzionali, prestazionali, di usabilità e di manutenibilità pattuiti."
R:
  "RAG (Retrieval-Augmented Generation)": "Pattern architetturale nel quale la generazione di testo da parte dell'LLM è vincolata e integrata da frammenti di testo pertinenti estratti in tempo reale da una base documentale esterna indicizzata."
  "Redattore (Ruolo di Progetto)": "Membro del team incaricato della stesura o revisione contenutistica di un documento di progetto nel rispetto delle convenzioni tipografiche e stilistiche."
  "Regolamento Aziendale": "Insieme di norme, policy interne e accordi integrativi stabiliti da un'azienda per disciplinare la condotta e la fruizione di istituti come ferie e permessi."
  "Repository": "Archivio centralizzato su piattaforma di versionamento in cui risiedono il codice sorgente, la documentazione, gli script e la cronologia delle modifiche."
  "Requisiti di Business (RB)": "Insieme di esigenze e vincoli strategici di alto livello definiti nel capitolato per descrivere il valore aziendale atteso dal prodotto."
  "Requisiti Funzionali (RF)": "Servizi, comportamenti e funzionalità operative che il sistema software deve erogare a favore dei propri utenti."
  "Requisiti Non Funzionali (RNF)": "Attributi qualitativi, prestazioni attese, vincoli di sicurezza, robustezza e scalabilità che il sistema deve garantire durante l'erogazione dei servizi."
  "Requisiti di Vincolo": "Condizioni prescrittive imposte dal proponente o dal committente su tecnologie, piattaforme, linguaggi o standard operativi non derogabili."
  "Responsabile (Ruolo di Progetto)": "Membro del team che detiene la responsabilità legale e organizzativa del gruppo nei confronti di committente e proponente, coordina i compiti e approva i rilasci."
  "Retrospettiva": "Pratica di revisione agile condotta al termine di ogni sprint per analizzare l'efficacia del processo di lavoro, evidenziare criticità e pianificare azioni correttive per il ciclo successivo."
  "Riepilogo": "Messaggio esplicito visualizzato nella chat del Concierge che riassume in maniera univoca date, ore e tipo di richiesta prima di richiederne la conferma."
  "ROL (Riduzione Orario di Lavoro)": "Istituzione contrattuale che consente al lavoratore di fruire di permessi retribuiti a ore, inclusa nell'area tematica dell'MVP."
  "RTB (Requirements and Technology Baseline)": "Prima revisione formale del corso di Ingegneria del Software, composta da una valutazione tecnologica (PoC con Cardin) e metodologica (gestione con Vardanega)."
S:
  "Saldo Residuo": "Quantità di ferie o permessi ancora spettanti al lavoratore, che il sistema deve recuperare da fonti autorizzate ufficiali senza effettuare deduzioni arbitrarie."
  "Scrum": "Framework operativo di stampo agile basato su cicli iterativi e incrementali di sviluppo (sprint), ruoli definiti e momenti periodici di allineamento e verifica."
  "Semantic Versioning (SemVer)": "Convenzione formale di versionamento basata su tre cifre (MAJOR.MINOR.PATCH) utilizzata per tracciare lo stato di maturità di documenti e codice."
  "Simulatore": "Vedi \"Mock\"."
  "Skill": "Vedi \"Abilità\"."
  "Sprint": "Intervallo temporale a durata fissa (es. 2 settimane) durante il quale il team si impegna a realizzare un insieme prefissato di attività dal backlog."
  "Stakeholder": "Qualsiasi individuo, gruppo o organizzazione che ha un interesse attivo o può influenzare/essere influenzato dalle decisioni e dagli esiti del progetto."
T:
  "Technology Baseline (TB)": "Colloquio preliminare e bloccante della revisione RTB sostenuto con il Prof. Cardin, volto a saggiare l'adeguatezza tecnologica del gruppo tramite il PoC."
  "Template": "Modello strutturale predefinito utilizzato per redigere documenti, verbali o slide garantendo uniformità visiva e conformità alle convenzioni del gruppo."
  "Test di Integrazione": "Collaudo mirato a verificare la corretta interazione tra moduli o sottosistemi software differenti quando connessi tra loro."
  "Test di Sistema": "Verifica complessiva del software eseguita sull'applicazione completa per accertare la conformità a tutti i requisiti specificati nell'AdR."
  "Test Unitari (Unit Test)": "Test automatizzati concepiti per validare il corretto funzionamento della più piccola unità di codice verificabile (es. singola funzione o classe)."
  "Tool Use (Function Calling)": "Meccanismo mediante cui un LLM analizza il messaggio dell'utente e decide di invocare una funzione o API esterna strutturata producendo i parametri necessari."
  "Tracciabilità": "Capacità di ricostruire la corrispondenza biunivoca tra requisiti, casi d'uso, decisioni architetturali, componenti di codice, fonti utilizzate e test."
  "Typst": "Linguaggio di markup moderno orientato alla composizione tipografica, adottato come alternativa snella ed efficiente a LaTeX per la redazione dei documenti."
U:
  "Unità di Conoscenza": "Entità informativa atomica o aggregata derivata dall'elaborazione delle fonti, corredata da metadati su provenienza, data, versione e perimetro di validità."
  "Use Case Diagram": "Diagramma UML standard utilizzato per rappresentare visivamente gli attori, i casi d'uso e le reciproche relazioni (inclusione, estensione, generalizzazione)."
V:
  "Validazione": "Processo di collaudo e ispezione finalizzato a determinare se il prodotto software realizzato soddisfa effettivamente le reali esigenze del proponente (\"Stiamo costruendo il prodotto giusto?\")."
  "Vector Database (Vector DB)": "Sistema di archiviazione specializzato nell'indicizzazione e ricerca rapida per similarità geometrica tra vettori numerici ad alta dimensionalità (embedding)."
  "Verbale Esterno (VE)": "Documento formale che sintetizza e traccia i contenuti, le domande, le risposte e le decisioni concordate durante un incontro con l'azienda proponente (Eggon)."
  "Verbale Interno (VI)": "Documento formale che verbalizza l'ordine del giorno, le discussioni, la ripartizione dei ruoli e le decisioni operative assunte dal gruppo fornitore."
  "Verifica": "Processo sistematico di analisi statica o dinamica volto a garantire che i prodotti intermedi di una fase soddisfino le specifiche fissate all'inizio della stessa (\"Stiamo costruendo il prodotto nel modo giusto?\")."
  "Verificatore (Ruolo di Progetto)": "Membro del team incaricato di esaminare in modo critico e indipendente la correttezza, la forma, la conformità normativa e l'assenza di errori negli artefatti prodotti dai redattori o programmatori."
W:
  "Way of Working (WoW)": "L'insieme normato di regole, prassi, ruoli, strumenti e flussi operativi che il gruppo fornitore sceglie di adottare e perfezionare per condurre il progetto."
  "Workflow": "Sequenza coordinata e automatizzata di attività operative necessarie per portare a compimento un processo (es. pipeline di test e rilascio documentale)."
